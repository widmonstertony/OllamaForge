name: Cross-platform tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - run: npm test
      - name: macOS MLX request handoff
        if: runner.os == 'macOS'
        run: python3 macos/test_mlx_request_handoff.py
      - run: node --check macos/local-codex.mjs
      - name: Windows runtime and startup portability tests
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run test:strata-startup
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Path . -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$fileErrors)
            $allErrors += $fileErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List
            throw "PowerShell syntax validation failed."
          }
      - name: DeepSeek Windows shortcut
        if: runner.os == 'Windows'
        shell: powershell
        run: npm run test:deepseek-shortcut
